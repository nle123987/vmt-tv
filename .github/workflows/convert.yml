name: Convert ClearKey playlist
on:
  schedule:
    - cron: '0 * * * *'   # chạy vào phút 0 mỗi giờ (UTC)
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Convert
        run: |
          curl -sL "https://raw.githubusercontent.com/vuminhthanh12/vuminhthanh12/refs/heads/main/vmttv" -o raw.m3u

          python3 - << 'EOF'
          import re, json, base64, binascii

          def b64url_to_hex(s: str) -> str:
              s = s.strip()
              s = s + '=' * (-len(s) % 4)
              raw = base64.urlsafe_b64decode(s)
              return binascii.hexlify(raw).decode()

          def json_clearkey_to_kv(json_str: str):
              try:
                  data = json.loads(json_str)
                  key_obj = data["keys"][0]
                  kid_hex = b64url_to_hex(key_obj["kid"])
                  k_hex = b64url_to_hex(key_obj["k"])
                  return f"{kid_hex}:{k_hex}"
              except Exception:
                  return None

          def process_clearkey_payload(payload: str):
              payload = payload.strip()
              if re.match(r'^[0-9a-fA-F]{32}:[0-9a-fA-F]{32}$', payload):
                  return payload
              if payload.startswith('{'):
                  return json_clearkey_to_kv(payload)
              if payload.startswith('http://') or payload.startswith('https://'):
                  return payload
              return None

          with open("raw.m3u", encoding="utf-8", errors="replace") as f:
              lines = f.readlines()

          out = []
          chno = 0
          current_license_type = None

          for line in lines:
              stripped = line.rstrip("\n")

              if stripped.startswith("#EXTINF:"):
                  chno += 1
                  current_license_type = None
                  if 'tvg-chno="' in stripped:
                      new_line = re.sub(r'tvg-chno="[^"]*"', f'tvg-chno="{chno}"', stripped, count=1)
                  else:
                      new_line = re.sub(r'^(#EXTINF:-?\d+)(\s|,)', rf'\1 tvg-chno="{chno}"\2', stripped, count=1)
                  out.append(new_line + "\n")
                  continue

              m_type = re.match(r'^#KODIPROP:inputstream\.adaptive\.license_type=(.+)$', stripped)
              if m_type:
                  lt = m_type.group(1).strip().lower()
                  if lt == "clearkey":
                      current_license_type = "clearkey"
                      continue
                  elif lt in ("widevine", "com.widevine.alpha"):
                      current_license_type = "widevine"
                      out.append("#KODIPROP:inputstream.adaptive.license_type=com.widevine.alpha\n")
                      continue
                  else:
                      current_license_type = lt
                      out.append(line)
                      continue

              m_key = re.match(r'^#KODIPROP:inputstream\.adaptive\.(?:license_key=|drm_legacy=org\.w3\.clearkey\|)(.+)$', stripped)
              if m_key:
                  payload = m_key.group(1)

                  if current_license_type == "clearkey":
                      kv = process_clearkey_payload(payload)
                      if kv:
                          out.append(f"#KODIPROP:inputstream.adaptive.drm_legacy=org.w3.clearkey|{kv}\n")
                      else:
                          out.append(line if line.endswith("\n") else line + "\n")
                      continue

                  elif current_license_type == "widevine":
                      out.append(f"#KODIPROP:inputstream.adaptive.license_key={payload}\n")
                      continue

                  else:
                      out.append(line)
                      continue

              out.append(line)

          with open("vmttv_kodi.m3u", "w", encoding="utf-8") as f:
              f.writelines(out)

          print("Converted successfully")
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vmttv_kodi.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto convert ClearKey $(date -u +%Y-%m-%d)"
          git push
