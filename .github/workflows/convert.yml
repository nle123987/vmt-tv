name: Convert ClearKey playlist

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & Convert
        run: |
          curl -sL "https://raw.githubusercontent.com/vuminhthanh12/vuminhthanh12/refs/heads/main/vmttv" -o raw1.m3u
          curl -sL "https://tv.vietanhtv.top/sex/" -o raw2.m3u
          { cat raw1.m3u; grep -v '^#EXTM3U' raw2.m3u || true; } > raw.m3u

          python3 - << 'EOF'
          import re, json, base64, binascii, urllib.request, ssl

          UA = "Dalvik/2.1.0"

          def b64url_to_hex(s):
              s = s.strip() + "=" * (-len(s.strip()) % 4)
              return binascii.hexlify(base64.urlsafe_b64decode(s)).decode()

          def parse_json(text):
              try:
                  data = json.loads(text)
                  k = data["keys"][0]
                  return f"{b64url_to_hex(k['kid'])}:{b64url_to_hex(k['k'])}"
              except: return None

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, context=ssl.create_default_context(), timeout=12) as r:
                      return parse_json(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  print(f"[WARN] {url} -> {e}")
                  return None

          def to_kv(payload):
              if not payload: return None
              payload = re.sub(r"^org\.w3\.clearkey\|", "", payload, flags=re.I).strip()
              if re.fullmatch(r"[0-9a-fA-F]{32}:[0-9a-fA-F]{32}", payload):
                  return payload.lower()
              if payload.startswith("{"): return parse_json(payload)
              if payload.startswith("http"):
                  print(f"[INFO] Fetch {payload}")
                  return fetch(payload)
              return None

          lines = open("raw.m3u", encoding="utf-8", errors="replace").read().splitlines()
          out, chno, i, n = [], 0, 0, len(lines)

          while i < n:
              line = lines[i]
              if line.startswith("#EXTINF:"):
                  chno += 1
                  if 'tvg-chno="' in line:
                      line = re.sub(r'tvg-chno="[^"]*"', f'tvg-chno="{chno}"', line, 1)
                  else:
                      line = re.sub(r'^(#EXTINF:-?\d+)', rf'\1 tvg-chno="{chno}"', line, 1)

                  license_key = None
                  has_is = has_mt = False
                  other_props = []
                  j = i + 1

                  while j < n and not lines[j].startswith("#EXTINF:") and not lines[j].startswith("http"):
                      p = lines[j].strip()
                      if not p:
                          j += 1
                          continue
                      if p == "#KODIPROP:inputstream=inputstream.adaptive":
                          has_is = True
                      elif "manifest_type=" in p:
                          has_mt = True
                      elif "license_key=" in p or "drm_legacy=" in p:
                          m = re.search(r"(?:license_key|drm_legacy)=(.+)", p, re.I)
                          if m:
                              license_key = m.group(1).strip()
                      elif p.startswith("#KODIPROP:inputstream.adaptive.license_type="):
                          pass
                      elif p.startswith("#KODIPROP:") or p.startswith("#EXTVLCOPT:"):
                          other_props.append(p)
                      j += 1

                  stream = lines[j] if j < n else ""
                  out.append(line)

                  kv = to_kv(license_key)

                  if kv:
                      out.append("#EXTVLCOPT:http-user-agent=Dalvik/2.1.0")
                      if not has_is:
                          out.append("#KODIPROP:inputstream=inputstream.adaptive")
                      if not has_mt:
                          out.append("#KODIPROP:inputstream.adaptive.manifest_type=mpd")
                      out.append(f"#KODIPROP:inputstream.adaptive.drm_legacy=org.w3.clearkey|{kv}")
                  else:
                      out.append("#EXTVLCOPT:http-user-agent=Dalvik/2.1.0")
                      if not has_is:
                          out.append("#KODIPROP:inputstream=inputstream.adaptive")
                      for p in other_props:
                          out.append(p)
                      if license_key:
                          out.append(f"#KODIPROP:inputstream.adaptive.license_key={license_key}")

                  if stream:
                      out.append(stream)
                  i = j + 1
                  continue

              if not line.startswith("#EXTINF:"):
                  out.append(line)
              i += 1

          open("vmttv_kodi.m3u", "w", encoding="utf-8").write("\n".join(out) + "\n")
          print("Converted successfully")
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vmttv_kodi.m3u
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto convert ClearKey $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes"
          fi
